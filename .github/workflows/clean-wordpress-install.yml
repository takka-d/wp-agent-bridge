name: Clean WordPress package test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'plugin/wp-agent-bridge/**'
      - '.github/workflows/clean-wordpress-install.yml'
  push:
    branches: [main]
    paths:
      - 'plugin/wp-agent-bridge/**'
      - '.github/workflows/clean-wordpress-install.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          /tmp/wp --info

      - name: Install clean WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp-agent-bridge-test
          /tmp/wp core download --version=7.1 --path=/tmp/wp-agent-bridge-test
          /tmp/wp config create \
            --path=/tmp/wp-agent-bridge-test \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          /tmp/wp core install \
            --path=/tmp/wp-agent-bridge-test \
            --url=http://wp-agent-bridge.test \
            --title='WP Agent Bridge clean test' \
            --admin_user=admin \
            --admin_password='Temporary-Test-Password-2026!' \
            --admin_email=admin@example.test \
            --skip-email
          /tmp/wp core version --path=/tmp/wp-agent-bridge-test

      - name: Build plugin ZIP from tested source
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version: //p' plugin/wp-agent-bridge/takka-wordpress-bridge.php | head -n1 | tr -d '\r')"
          stable="$(sed -n 's/^Stable tag: //p' plugin/wp-agent-bridge/readme.txt | head -n1 | tr -d '\r')"
          test -n "$version"
          test "$version" = "$stable"
          echo "WPAB_VERSION=$version" >> "$GITHUB_ENV"
          (cd plugin && zip -qr "/tmp/wp-agent-bridge-${version}.zip" wp-agent-bridge)
          sha256sum "/tmp/wp-agent-bridge-${version}.zip"

      - name: Install and activate packaged plugin
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp plugin install "/tmp/wp-agent-bridge-${WPAB_VERSION}.zip" \
            --activate \
            --path=/tmp/wp-agent-bridge-test
          /tmp/wp plugin get wp-agent-bridge \
            --fields=name,status,version \
            --format=json \
            --path=/tmp/wp-agent-bridge-test \
            | tee /tmp/plugin-state.json
          php -r '$d=json_decode(file_get_contents("/tmp/plugin-state.json"),true); if(!is_array($d)||($d["status"]??"")!=="active"||($d["version"]??"")!==getenv("WPAB_VERSION")){fwrite(STDERR,"Packaged plugin state/version mismatch\n"); exit(1);}'

      - name: Verify packaged bootstrap and routes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval '
            foreach ([
              "TakKa_WordPress_Bridge_Onboarding",
              "TakKa_WordPress_Bridge_Direct_Runtime",
              "TakKa_WordPress_Bridge_Direct_Runtime_V2",
              "TakKa_WordPress_Bridge_Direct_Webhook_Loop_Guard",
              "TakKa_WordPress_Bridge_Direct_Media",
              "TakKa_WordPress_Bridge_Runtime_Media_Chunks",
            ] as $class) {
              if (!class_exists($class)) { fwrite(STDERR, "Missing class: {$class}\n"); exit(1); }
            }
            do_action("rest_api_init");
            $routes = rest_get_server()->get_routes();
            foreach ([
              "/wp-agent-bridge-onboarding/v2/manifest-complete",
              "/wp-agent-bridge-runtime/v1/github-webhook",
              "/wp-agent-bridge-runtime/v1/media-upload",
              "/wp-agent-bridge-media/v1/upload-chunk",
            ] as $route) {
              if (!isset($routes[$route])) { fwrite(STDERR, "Missing route: {$route}\n"); exit(1); }
            }
            echo "Packaged plugin bootstrap/routes OK.\n";
          ' --path=/tmp/wp-agent-bridge-test

      - name: Verify active-plugin and sensitive-option guards
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wpab-basic-guards.php <<'PHP'
          <?php
          wp_set_current_user(1);
          function fail_now(string $m): void { fwrite(STDERR, $m . "\n"); exit(1); }
          $payload = base64_encode(wp_json_encode([
              'action' => 'plugin.delete',
              'params' => ['file' => 'wp-agent-bridge/takka-wordpress-bridge.php', 'confirm' => true],
          ]));
          $r = new WP_REST_Request('POST', '/takka-bridge/v1/manage');
          $r->set_header('content-type', 'application/json');
          $r->set_body(wp_json_encode(['payload_b64' => $payload]));
          $deleted = TakKa_WordPress_Bridge_V04::manage($r);
          if (!is_wp_error($deleted) || $deleted->get_error_code() !== 'takka_bridge_plugin_active_delete_blocked') {
              fail_now('Active plugin deletion was not blocked.');
          }
          $sensitive = TakKa_WordPress_Bridge_V08_Options::get(['name' => 'takka_bridge_secret']);
          if (!is_wp_error($sensitive) || $sensitive->get_error_code() !== 'takka_bridge_option_sensitive') {
              fail_now('Sensitive option was not blocked.');
          }
          echo "Packaged basic guards OK.\n";
          PHP
          /tmp/wp eval-file /tmp/wpab-basic-guards.php --path=/tmp/wp-agent-bridge-test

      - name: Verify multi-chunk media reconstruction and integrity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wp-agent-bridge-media-chunks.php <<'PHP'
          <?php
          wp_set_current_user(1);
          do_action('rest_api_init');
          function media_fail(string $message): void { fwrite(STDERR, $message . "\n"); exit(1); }
          function png_chunk(string $type, string $data): string { return pack('N', strlen($data)) . $type . $data . pack('N', crc32($type . $data)); }
          $png = "\x89PNG\r\n\x1a\n";
          $png .= png_chunk('IHDR', pack('NNCCCCC', 1, 1, 8, 6, 0, 0, 0));
          $png .= png_chunk('tEXt', "Comment\0" . str_repeat('A', 2400000));
          $png .= png_chunk('IDAT', gzcompress("\x00\x00\x00\x00\x00", 9));
          $png .= png_chunk('IEND', '');
          $expected_bytes = strlen($png);
          $expected_sha = hash('sha256', $png);
          $chunks = str_split($png, 1200000);
          $upload_id = 'ci-media-' . substr($expected_sha, 0, 20);
          $final = null;
          foreach ($chunks as $index => $chunk) {
              $body = [
                  'upload_id' => $upload_id,
                  'chunk_index' => $index,
                  'chunk_count' => count($chunks),
                  'filename' => 'wp-agent-bridge-chunk-test.png',
                  'expected_bytes' => $expected_bytes,
                  'expected_sha256' => $expected_sha,
                  'chunk_bytes' => strlen($chunk),
                  'chunk_sha256' => hash('sha256', $chunk),
                  'data_b64' => base64_encode($chunk),
              ];
              $request = new WP_REST_Request('POST', '/wp-agent-bridge-media/v1/upload-chunk');
              $request->set_header('content-type', 'application/json');
              $request->set_body(wp_json_encode($body));
              $response = rest_do_request($request);
              $response = rest_ensure_response($response);
              if ($response->get_status() >= 400) media_fail('Chunk HTTP ' . $response->get_status());
              $final = $response->get_data();
          }
          if (!is_array($final) || empty($final['id'])) media_fail('Final attachment missing.');
          if ((int)($final['bytes'] ?? 0) !== $expected_bytes) media_fail('Byte count mismatch.');
          if (!hash_equals($expected_sha, (string)($final['sha256'] ?? ''))) media_fail('SHA mismatch.');
          $attachment_id = (int)$final['id'];
          $path = get_attached_file($attachment_id);
          if (!is_string($path) || !is_file($path) || filesize($path) !== $expected_bytes || !hash_equals($expected_sha, (string)hash_file('sha256', $path))) {
              media_fail('Stored attachment integrity mismatch.');
          }
          wp_delete_attachment($attachment_id, true);
          echo "Multi-chunk media reconstruction passed: {$expected_bytes} bytes, " . count($chunks) . " chunks.\n";
          PHP
          /tmp/wp eval-file /tmp/wp-agent-bridge-media-chunks.php --path=/tmp/wp-agent-bridge-test
