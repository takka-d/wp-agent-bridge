name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugin/wp-agent-bridge -type f -name '*.php' -print0)

      - name: Direct Runtime self-webhook loop regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/direct-webhook-loop-guard-test.php

      - name: Direct Runtime in-flight ownership regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/direct-command-inflight-test.php

      - name: Direct Runtime atomic bookkeeping regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/direct-atomic-bookkeeping-test.php

      - name: Direct Media pre-dispatch short-circuit regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/direct-media-pre-dispatch-test.php

      - name: Media binary-chunk staging regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/media-binary-chunk-staging-test.php

      - name: Automatic media path resolution regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/media-auto-path-resolution-test.php

      - name: Client media preparation preserves actual file bytes
        run: python3 tests/media-client-preparation-test.py

      - name: Workspace regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/workspace-test.php

      - name: Runtime capability catalog regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/runtime-capabilities-test.php

      - name: Canonical runtime guidance regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/runtime-guidance-test.php

      - name: Deterministic operation policy regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/operation-policy-test.php
          php tests/runtime-result-summary-test.php

      - name: Bounded post content range regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/post-content-range-test.php

      - name: Read-only batch regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/read-only-batch-test.php

      - name: Integrity diagnostics regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/integrity-diagnostics-test.php

      - name: Diagnostics compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/diagnostics-compat-test.php

      - name: WPVibe server compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/wpvibe-server-compat-test.php

      - name: Site Icon and connector media regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/site-icon-media-flow-test.php

      - name: Verify development and stable metadata
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(sed -n 's/^ \* Version: //p' plugin/wp-agent-bridge/takka-wordpress-bridge.php | head -n1 | tr -d '\r')"
          stable_tag="$(sed -n 's/^Stable tag: //p' plugin/wp-agent-bridge/readme.txt | head -n1 | tr -d '\r')"
          test -n "$plugin_version"
          test -n "$stable_tag"
          printf '%s\n' "$plugin_version" "$stable_tag" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$' >/dev/null
          newest="$(printf '%s\n%s\n' "$stable_tag" "$plugin_version" | sort -V | tail -n1)"
          test "$newest" = "$plugin_version"
          test -f LICENSE.md
          test -f plugin/wp-agent-bridge/LICENSE.md

      - name: Reject obvious secrets and development payloads
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -path '*/commands/pending/*.json' -o -path '*/commands/completed/*.json' -o -path '*/results/*.json' \) -print -quit | grep -q .; then
            echo 'Runtime command/result payload found in public repository.' >&2
            exit 1
          fi
          if grep -R -I -n -E -- '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-proj-[A-Za-z0-9_-]{20,}' . --exclude-dir=.git; then
            echo 'Text resembling a private key or access token was found.' >&2
            exit 1
          fi
