name: Rebuild WP Agent Bridge Helper ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-wp-agent-bridge-helper-022-zip.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build helper ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          source = Path('plugins/wp-agent-bridge-helper')
          output = Path('downloads/wp-agent-bridge-helper-0.2.2.zip')
          required = [
              Path('plugin.json'),
              Path('.app.json'),
              Path('.codex-plugin/plugin.json'),
              Path('skills/wp-agent-bridge/SKILL.md'),
              Path('README.md'),
          ]
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for relative in required:
                  archive.write(source / relative, relative.as_posix())
          PY
      - name: Validate helper package
        run: python3 tests/codex-helper-package-test.py
      - name: Commit helper ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/wp-agent-bridge-helper-0.2.2.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild WP Agent Bridge Helper 0.2.2 ZIP'
          git push origin HEAD:main
