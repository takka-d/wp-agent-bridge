name: External tester kit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'plugin/wp-agent-bridge/**'
      - '.github/workflows/external-tester-kit.yml'
      - 'docs/EXTERNAL_TEST_GUIDE_JA.md'
      - 'docs/EXTERNAL_TEST_RESULT.md'
  push:
    branches: [main]
    paths:
      - 'plugin/wp-agent-bridge/**'
      - '.github/workflows/external-tester-kit.yml'
      - 'docs/EXTERNAL_TEST_GUIDE_JA.md'
      - 'docs/EXTERNAL_TEST_RESULT.md'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reproducible tested plugin ZIP
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version: //p' plugin/wp-agent-bridge/takka-wordpress-bridge.php | head -n1 | tr -d '\r')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p tester-kit
          archive="tester-kit/wp-agent-bridge-${version}.zip"
          verify_archive="$(mktemp --suffix=.zip)"

          # git archive derives ZIP timestamps from the commit rather than the
          # checkout time, so the same commit produces byte-identical packages.
          git archive --format=zip --prefix=wp-agent-bridge/ HEAD:plugin/wp-agent-bridge > "$archive"
          git archive --format=zip --prefix=wp-agent-bridge/ HEAD:plugin/wp-agent-bridge > "$verify_archive"
          cmp "$archive" "$verify_archive"
          rm -f "$verify_archive"

          sha256sum "$archive"
          echo "reproducible_archive=OK"

      - name: Generate deterministic large PNG media fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import binascii
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind: bytes, data: bytes) -> bytes:
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0))
          png += chunk(b'tEXt', b'Comment\x00' + (b'A' * 2_400_000))
          png += chunk(b'IDAT', zlib.compress(b'\x00\x00\x00\x00\x00', 9))
          png += chunk(b'IEND', b'')
          path = Path('tester-kit/03_画像転送テスト用_約2.4MB.png')
          path.write_bytes(png)
          size = path.stat().st_size
          if not 1_572_864 < size <= 6_291_456:
              raise SystemExit(f'fixture size out of target range: {size}')
          print(f'{path}: {size} bytes')
          PY

      - name: Add self-contained Japanese test guide and result sheet
        shell: bash
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          cp docs/EXTERNAL_TEST_GUIDE_JA.md tester-kit/01_テスト手順.md
          cp docs/EXTERNAL_TEST_RESULT.md tester-kit/02_テスト結果記入.md
          sha256sum \
            "tester-kit/wp-agent-bridge-${VERSION}.zip" \
            tester-kit/03_画像転送テスト用_約2.4MB.png \
            > tester-kit/SHA256SUMS
          cat > tester-kit/最初に読んでください.txt <<EOF
          WP Agent Bridge ${VERSION} 自己完結runtime 外部テストセット

          1. まず「01_テスト手順.md」を読んでください。
          2. WordPressへ入れるファイルは「wp-agent-bridge-${VERSION}.zip」です。
          3. GitHub runtime repositoryとsite-specific GitHub Appはテスター本人が所有します。
          4. 「03_画像転送テスト用_約2.4MB.png」は、画像全体を1個のcommand JSONへ入れずuser-owned runtime経由で送る確認用です。
          5. 結果は「02_テスト結果記入.md」にローカル記録できます。GitHubユーザー名やWordPress URLを運営者へ提出する必要はありません。
          6. secret、token、private key、Webhook secret、WordPress内容を第三者へ送らないでください。
          7. エラーが出たら成功させるために別経路へ迂回せず、その時点で停止してください。
          EOF

      - name: Upload external tester kit
        uses: actions/upload-artifact@v4
        with:
          name: wp-agent-bridge-external-tester-kit-${{ steps.build.outputs.version }}-self-contained
          path: tester-kit/
          if-no-files-found: error
          retention-days: 30
