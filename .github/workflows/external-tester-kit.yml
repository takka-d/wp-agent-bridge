name: Direct Runtime external tester kit

on:
  workflow_dispatch:
  push:
    branches:
      - direct-runtime-prototype
    paths:
      - '.github/workflows/external-tester-kit.yml'
      - 'plugin/wp-agent-bridge/**'
      - 'docs/EXTERNAL_TEST_GUIDE_JA.md'
      - 'docs/EXTERNAL_TEST_RESULT.md'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build current Direct Runtime plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tester-kit build
          mkdir -p tester-kit build/wp-agent-bridge
          cp -a plugin/wp-agent-bridge/. build/wp-agent-bridge/
          (
            cd build
            zip -r -9 ../tester-kit/wp-agent-bridge-direct-runtime-trial.zip wp-agent-bridge >/dev/null
          )

      - name: Add current test guide and result sheet
        shell: bash
        run: |
          set -euo pipefail
          cp docs/EXTERNAL_TEST_GUIDE_JA.md tester-kit/01_テスト手順.md
          cp docs/EXTERNAL_TEST_RESULT.md tester-kit/02_テスト結果記入.md
          cat > tester-kit/最初に読んでください.txt <<'EOF'
          WP Agent Bridge Direct Runtime 外部テストセット

          1. まず「01_テスト手順.md」を読んでください。
          2. WordPressへ入れるのは「wp-agent-bridge-direct-runtime-trial.zip」です。
          3. 現在の方式は、利用者自身のprivate GitHub repository + サイト専用GitHub App + signed push Webhookです。
          4. WPVibe、運営者の中継サーバー、通常処理のGitHub Actionsは必要ありません。
          5. メディアアップロードもWP Agent Bridge単体でテストします。
          6. secret、token、private key、Webhook secretは誰にも送らないでください。
          7. エラー時は同じ操作を連打せず、画面と手順番号を残してください。
          EOF

      - name: Upload external tester kit
        uses: actions/upload-artifact@v4
        with:
          name: wp-agent-bridge-direct-runtime-tester-kit-20260903
          path: tester-kit/
          if-no-files-found: error
          retention-days: 30
