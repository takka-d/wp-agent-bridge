name: Generic branding refactor
# retry-marker-1
# retry-marker-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generic-branding-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove site-specific/internal TakKa branding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          SOURCE = '__WPAB_SOURCE_REPOSITORY__'
          ALLOWED_SOURCE = 'takka-d/wp-agent-bridge'

          def transform(text: str) -> str:
              text = text.replace(ALLOWED_SOURCE, SOURCE)
              text = re.sub(r'https?://takka-note\.com/wp-agent-bridge/?', 'https://github.com/' + SOURCE, text, flags=re.I)
              text = text.replace('takka-d/chatgpt-data', 'legacy operator-owned runtime repository')
              text = text.replace('Contributors: takka-d', 'Contributors:')
              pairs = [
                  ('TakKa_WordPress_Bridge', 'WP_Agent_Bridge'),
                  ('TAKKA_WORDPRESS_BRIDGE', 'WP_AGENT_BRIDGE'),
                  ('takka_wordpress_bridge', 'wp_agent_bridge'),
                  ('X-TakKa-', 'X-WPAB-'),
                  ('x-takka-', 'x-wpab-'),
                  ('.takka-new-', '.wpab-new-'),
                  ('takka_bridge', 'wpab'),
                  ('takka_direct', 'wpab_direct'),
                  ('takka-direct', 'wpab-direct'),
                  ('takka-bridge-onboarding', 'wp-agent-bridge-onboarding'),
                  ('takka-wordpress-bridge', 'wp-agent-bridge'),
                  ('takka-bridge', 'wp-agent-bridge'),
                  ('takka-v', 'wpab-v'),
                  ('TAKKA_', 'WPAB_'),
                  ('takka_', 'wpab_'),
              ]
              for old, new in pairs:
                  text = text.replace(old, new)
              text = re.sub(r'\bTakKa\b', 'WP Agent Bridge', text)
              text = re.sub(r'\btakka-d\b', 'WP Agent Bridge', text)
              text = re.sub(r'\btakka\b', 'wp-agent-bridge', text, flags=re.I)
              return text.replace(SOURCE, ALLOWED_SOURCE)

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = [Path(p.decode()) for p in tracked if p]

          # Rename implementation/bootstrap files first.
          for path in sorted(paths, key=lambda p: len(p.parts), reverse=True):
              old = path.as_posix()
              new = old.replace('class-takka-wordpress-bridge', 'class-wp-agent-bridge')
              new = new.replace('takka-wordpress-bridge.php', 'wp-agent-bridge.php')
              if new != old:
                  Path(new).parent.mkdir(parents=True, exist_ok=True)
                  subprocess.check_call(['git', 'mv', old, new])

          # Rewrite every UTF-8 tracked text file, excluding binary archives.
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              if path.as_posix().startswith('.github/workflows/'):
                  continue
              if path.suffix.lower() in {'.zip', '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico'}:
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = transform(text)
              if path.as_posix() == 'plugin/wp-agent-bridge/wp-agent-bridge.php':
                  updated = updated.replace(' * Version: 1.1.39', ' * Version: 1.1.40')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Rebuild the checked-in Codex helper archive from the genericized source.
          helper = Path('codex-plugin/wp-agent-bridge-codex-helper')
          archive_path = Path('downloads/wp-agent-bridge-codex-helper-0.1.0.zip')
          if helper.is_dir() and archive_path.parent.is_dir():
              with zipfile.ZipFile(archive_path, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
                  for path in sorted(p for p in helper.rglob('*') if p.is_file()):
                      zf.write(path, path.relative_to(helper).as_posix())

          # The one-shot workflow must not remain in the distributable source.
          workflow = Path('.github/workflows/generic-branding-refactor.yml')
          if workflow.exists():
              subprocess.check_call(['git', 'rm', '-f', workflow.as_posix()])

          # Enforce the rule: current source may contain "takka" only as the unavoidable
          # GitHub source repository owner/path.
          failures = []
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              if path.as_posix().startswith('.github/workflows/'):
                  continue
              if re.search('takka', path.as_posix(), flags=re.I):
                  failures.append(f'path: {path}')
                  continue
              if path.suffix.lower() in {'.zip', '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              residue = text.replace(ALLOWED_SOURCE, '')
              if re.search('takka', residue, flags=re.I):
                  for n, line in enumerate(residue.splitlines(), 1):
                      if re.search('takka', line, flags=re.I):
                          failures.append(f'{path}:{n}: {line[:180]}')
                          if len(failures) >= 80:
                              break
              if len(failures) >= 80:
                  break

          if archive_path.exists():
              with zipfile.ZipFile(archive_path) as zf:
                  for name in zf.namelist():
                      if re.search('takka', name, flags=re.I):
                          failures.append(f'zip path: {name}')
                          continue
                      try:
                          text = zf.read(name).decode('utf-8')
                      except (UnicodeDecodeError, KeyError):
                          continue
                      residue = text.replace(ALLOWED_SOURCE, '')
                      if re.search('takka', residue, flags=re.I):
                          failures.append(f'zip content: {name}')

          if failures:
              raise SystemExit('Residual site/internal branding found:\n' + '\n'.join(failures))

          bootstrap = Path('plugin/wp-agent-bridge/wp-agent-bridge.php')
          if not bootstrap.is_file() or ' * Version: 1.1.40' not in bootstrap.read_text(encoding='utf-8'):
              raise SystemExit('Generic bootstrap/version was not produced')
          PY

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find plugin/wp-agent-bridge -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 10 /tmp/php-lint.log

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/direct-webhook-loop-guard-test.php
          php tests/direct-command-inflight-test.php
          php tests/direct-atomic-bookkeeping-test.php
          php tests/direct-runtime-delivery-fallback-test.php
          php tests/direct-media-pre-dispatch-test.php
          php tests/media-binary-chunk-staging-test.php
          php tests/media-auto-path-resolution-test.php
          python3 tests/media-client-preparation-test.py
          python3 tests/codex-helper-package-test.py
          php tests/workspace-test.php
          php tests/runtime-capabilities-test.php
          php tests/runtime-guidance-test.php
          php tests/runtime-bootstrap-test.php
          php tests/post-concurrency-runtime-guidance-test.php
          php tests/post-reliability-runtime-guidance-test.php
          php tests/operation-policy-test.php
          php tests/runtime-result-summary-test.php
          php tests/post-content-range-test.php
          php tests/read-only-batch-test.php
          php tests/theme-read-reliability-test.php
          php tests/integrity-diagnostics-test.php
          php tests/diagnostics-compat-test.php
          php tests/wpvibe-server-compat-test.php
          php tests/site-icon-media-flow-test.php

      - name: Commit generic source
        id: generic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove site-specific TakKa branding from distributable'
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh update manifest
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.generic.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('plugin/wp-agent-bridge')
          bootstrap = root / 'wp-agent-bridge.php'
          version = None
          for line in bootstrap.read_text(encoding='utf-8').splitlines():
              if line.startswith(' * Version: '):
                  version = line.split(':', 1)[1].strip()
                  break
          if version != '1.1.40':
              raise SystemExit(f'Unexpected plugin version: {version!r}')

          entries = []
          decoded_bytes = 0
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              size = len(data)
              decoded_bytes += size
              entries.append(f'{rel}\0{sha}\0{size}\n'.encode())

          manifest = {
              'schema': 1,
              'repository': 'takka-d/wp-agent-bridge',
              'version': version,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'plugin_manifest_sha256': hashlib.sha256(b''.join(entries)).hexdigest(),
              'plugin_file_count': len(entries),
              'plugin_decoded_bytes': decoded_bytes,
              'self_update_action': 'bridge.self_update.apply',
              'source_mode_minimum_version': '1.1.7',
              'legacy_1_1_5_migration': 'tools/legacy-self-update/README.md',
          }
          Path('UPDATE_MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add UPDATE_MANIFEST.json
          git commit -m 'Refresh update manifest for 1.1.40'
          git push origin HEAD:main
