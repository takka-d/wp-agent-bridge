name: Refresh update manifest

on:
  push:
    branches: [main]
    paths:
      - 'plugin/wp-agent-bridge/**'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Build release pointer
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('plugin/wp-agent-bridge')
          bootstrap = root / 'takka-wordpress-bridge.php'
          version = None
          for line in bootstrap.read_text(encoding='utf-8').splitlines():
              if line.startswith(' * Version: '):
                  version = line.split(':', 1)[1].strip()
                  break
          if not version:
              raise SystemExit('Plugin Version header is missing')

          entries = []
          decoded_bytes = 0
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              size = len(data)
              decoded_bytes += size
              entries.append(f'{rel}\0{sha}\0{size}\n'.encode())

          aggregate = hashlib.sha256(b''.join(entries)).hexdigest()
          manifest = {
              'schema': 1,
              'repository': 'takka-d/wp-agent-bridge',
              'version': version,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'plugin_manifest_sha256': aggregate,
              'plugin_file_count': len(entries),
              'plugin_decoded_bytes': decoded_bytes,
              'self_update_action': 'bridge.self_update.apply',
              'source_mode_minimum_version': '1.1.7',
              'legacy_1_1_5_migration': 'tools/legacy-self-update/README.md',
          }
          Path('UPDATE_MANIFEST.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit refreshed pointer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- UPDATE_MANIFEST.json; then
            echo 'UPDATE_MANIFEST.json is already current.'
            exit 0
          fi
          version="$(python3 -c "import json; print(json.load(open('UPDATE_MANIFEST.json'))['version'])")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPDATE_MANIFEST.json
          git commit -m "Refresh update manifest for ${version}"
          git push origin HEAD:main
