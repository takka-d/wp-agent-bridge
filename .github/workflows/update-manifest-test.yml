name: Update manifest test

on:
  pull_request:
    branches: [main]
    paths:
      - 'UPDATE_MANIFEST.json'
      - '.github/workflows/update-manifest-test.yml'
  push:
    branches: [main]
    paths:
      - 'UPDATE_MANIFEST.json'
      - '.github/workflows/update-manifest-test.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify machine-readable update manifest against pinned Git objects
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('UPDATE_MANIFEST.json').read_text())
          required = {
              'schema', 'repository', 'version', 'source_commit',
              'plugin_manifest_sha256', 'plugin_file_count', 'plugin_decoded_bytes',
              'self_update_action', 'source_mode_minimum_version', 'legacy_1_1_5_migration',
          }
          missing = required - set(manifest)
          if missing:
              raise SystemExit(f'missing fields: {sorted(missing)}')
          if manifest['schema'] != 1 or manifest['repository'] != 'takka-d/wp-agent-bridge':
              raise SystemExit('unexpected manifest identity')
          commit = manifest['source_commit']
          if not isinstance(commit, str) or not re.fullmatch(r'[a-f0-9]{40}', commit):
              raise SystemExit('source_commit must be an exact 40-character SHA')

          prefix = 'plugin/wp-agent-bridge/'
          raw = subprocess.check_output(['git', 'ls-tree', '-r', '-z', commit, '--', prefix])
          rows = []
          total = 0
          for record in raw.split(b'\0'):
              if not record:
                  continue
              metadata, raw_path = record.split(b'\t', 1)
              _, kind, blob_sha = metadata.decode('ascii').split()
              if kind != 'blob':
                  continue
              path = raw_path.decode('utf-8')
              if not path.startswith(prefix):
                  raise SystemExit(f'unexpected path: {path}')
              relative = path[len(prefix):]
              data = subprocess.check_output(['git', 'cat-file', 'blob', blob_sha])
              digest = hashlib.sha256(data).hexdigest()
              rows.append((relative, digest, len(data)))
              total += len(data)
          rows.sort()
          canonical = b''.join(
              path.encode() + b'\0' + digest.encode() + b'\0' + str(size).encode() + b'\n'
              for path, digest, size in rows
          )
          aggregate = hashlib.sha256(canonical).hexdigest()

          main = subprocess.check_output(['git', 'show', f'{commit}:{prefix}takka-wordpress-bridge.php']).decode('utf-8')
          match = re.search(r'^ \* Version:\s*(.+)$', main, re.MULTILINE)
          version = match.group(1).strip() if match else ''

          checks = {
              'version': version,
              'plugin_manifest_sha256': aggregate,
              'plugin_file_count': len(rows),
              'plugin_decoded_bytes': total,
          }
          for key, actual in checks.items():
              if manifest[key] != actual:
                  raise SystemExit(f'{key} mismatch: manifest={manifest[key]!r}, actual={actual!r}')
          if manifest['self_update_action'] != 'bridge.self_update.apply':
              raise SystemExit('unexpected self_update_action')
          if manifest['legacy_1_1_5_migration'] != 'tools/legacy-self-update/README.md':
              raise SystemExit('unexpected legacy migration path')
          print(f"update manifest OK: version={version} files={len(rows)} bytes={total} sha256={aggregate}")
          PY
